pid /var/run/openresty/nginx.pid;
env CLIENT_ID;
env CLIENT_SECRET;

worker_processes auto;

events {
    worker_connections 2048;
}

http {

    # Point all temporary paths to the writable tmpfs volumes
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;


    include       mime.types;
    default_type  application/octet-stream;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Docker DNS only
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    lua_shared_dict sessions 50m;

    # # Logs
    # access_log /var/log/nginx/access.log;
    # error_log  /var/log/nginx/error.log notice;

    # Websocket support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream backend_app {
        server 192.168.3.164:8086;
        keepalive 32;
    }

    server {
        listen 443 ssl;
        server_name testme.me;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        ssl_prefer_server_ciphers on;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Prevent header spoofing BEFORE Lua
        more_clear_input_headers 'X-User';
        more_clear_input_headers 'X-User-Email';
        more_clear_input_headers 'X-Id-Token';

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            return 204;
        }

        # Login
        location = /login {
            access_by_lua_file /usr/local/openresty/nginx/lua/login.lua;
        }

        # Logout
        location = /logout {
            content_by_lua_file /usr/local/openresty/nginx/lua/logout.lua;
        }

        # OIDC callback
        location = /home {

            limit_except GET {
                deny all;
            }

            content_by_lua_file /usr/local/openresty/nginx/lua/home.lua;
        }

        # Protected app
        location / {

            # Authentication
            access_by_lua_file /usr/local/openresty/nginx/lua/auth.lua;

            proxy_pass http://backend_app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;

            # Buffers
            proxy_buffering on;
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;

            proxy_ignore_client_abort on;

            # Secure cookies
            proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
        }
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name testme.me;

        return 301 https://$host$request_uri;
    }
}
